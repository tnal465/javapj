<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h2>회원 정보 수정</h2>
<p th:text="${user.name + '님 (' + user.age + ' / ' + user.gender + ')'}"></p>

<form id="userEditForm" action="/user/userEditSuccess" method="post" onsubmit="return validatePassword()">
    <label>아이디:</label> 
    <span th:text="${user.id}"></span><br>

    <label for="currentPassword">비밀번호:</label>
	<a href="/user/editPassword" class="btn">비밀번호 변경</a><br>
    <label for="nickname">닉네임:</label>
    <input type="text" id="nickname" name="nickname" th:value="${user.nickname}" /><br>
	
	<!--  이거 넣는거 까먹어서 나중에 db 수정하고 mapper수정하고 주석 해제 해야댐 *******
	<label for="phoneNumber">전화번호:</label>
	<input type="tel" id="phoneNumber" name="phoneNumber" placeholder="010-1234-5678"><br>
	<label for="email">이메일:</label>
	<input type="email" id="email" name="email" placeholder="example@example.com" required><br>
	 -->

    <label for="address">배송지:</label>
    <input type="text" id="address" name="address" th:value="${user.address}" /><br>

    <br><br>
    <button type="submit">저장</button>
</form>

</body>
</html>
