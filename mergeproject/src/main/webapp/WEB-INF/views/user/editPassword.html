<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>

<h1>비밀번호 변경</h1>

<form id="editPassword" action="/user/editPassword" method="post">
    <label for="currentPassword">현재 비밀번호:</label>
    <input type="password" id="currentPassword" name="currentPassword" /><br>
    <!-- 현재 비밀번호 오류 메시지 표시 -->
    <div th:if="${currentPasswordError != null}" style="color: red;">
        <span th:text="${currentPasswordError}"></span>
    </div>

    <label for="newPassword">새 비밀번호:</label>
    <input type="password" id="newPassword" name="newPassword" /><br>

    <label for="confirmPassword">비밀번호 확인:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" /><br>
    <!-- 새 비밀번호와 확인 비밀번호 불일치 오류 메시지 표시 -->
    <div th:if="${passwordMismatchError != null}" style="color: red;">
        <span th:text="${passwordMismatchError}"></span>
    </div>

    <button type="submit">비밀번호 변경</button>

    <!-- 비밀번호 변경 성공 메시지 표시 -->
    <div th:if="${success != null}" style="color: green;">
        <span th:text="${success}"></span>
    </div>
</form>

</body>
</html>
